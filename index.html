<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>QRtoQR</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <h1>QRtoQR</h1>
          <p>スマホで読み取ったキーから対応値をQR/バーコードで表示</p>
        </div>
      </header>

      <main class="layout">
        <section class="panel import-panel">
          <h2>インポート</h2>
          <div class="import-grid">
            <label class="file-picker">
              <span>Excel / CSV を選択</span>
              <input id="fileInput" type="file" accept=".csv,.xlsx,.xls,.xlsm" />
            </label>

            <div class="sheet-url-box">
              <label for="googleSheetUrl">公開 Google Spreadsheet URL</label>
              <div class="row">
                <input id="googleSheetUrl" type="url" placeholder="https://docs.google.com/spreadsheets/..." />
                <button id="loadGoogleSheetBtn" type="button">読み込み</button>
              </div>
            </div>
          </div>

          <div class="status-box">
            <p id="statusText">インポートされたレコード数: 0</p>
          </div>
        </section>

        <section class="panel settings-panel">
          <h2>設定</h2>
          <div class="settings-grid">
            <label>
              <span>出力形式</span>
              <select id="outputType">
                <option value="CODE128">CODE128</option>
                <option value="CODE39">CODE39</option>
                <option value="EAN13">EAN13</option>
                <option value="ITF">ITF</option>
                <option value="QR">QR</option>
              </select>
            </label>

            <label>
              <span>描画サイズ</span>
              <select id="outputSize">
                <option value="180">小</option>
                <option value="240" selected>中</option>
                <option value="320">大</option>
              </select>
            </label>

            <label>
              <span>ズーム</span>
              <input id="zoomControl" type="range" min="1" max="4" step="0.1" value="1" />
            </label>

            <label>
              <span>フォーカス</span>
              <input id="focusControl" type="range" min="0" max="1" step="0.01" value="0.5" />
            </label>

            <button id="toggleTorchBtn" type="button">フラッシュ切替</button>
          </div>
        </section>

        <section class="camera-output-grid">
          <section class="panel camera-panel">
            <div class="panel-header">
              <h2>カメラ</h2>
              <button id="cameraBtn" type="button">カメラ開始</button>
            </div>
            <div class="camera-frame">
              <video id="video" playsinline muted autoplay></video>
              <div id="cameraPlaceholder" class="camera-placeholder">カメラを開始してください</div>
            </div>
            <div class="scan-summary">
              <p id="scanResult">スキャン結果: なし</p>
            </div>
          </section>

          <section class="panel output-panel">
            <div class="panel-header">
              <h2>対応値表示</h2>
            </div>
            <div class="output-stage">
              <canvas id="barcodeCanvas"></canvas>
              <div id="valueText" class="value-text">対応値</div>
            </div>
          </section>
        </section>
      </main>

      <footer class="footer">
        <p>QRtoQR • フロントエンド専用 • 無償利用</p>
      </footer>
    </div>

    <script src="vendor/xlsx.full.min.js"></script>
    <script src="vendor/JsBarcode.all.min.js"></script>
    <script src="vendor/qrcode.min.js"></script>
    <script src="vendor/jsQR.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
